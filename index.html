<style>
/* Layout: app bar with three tabs (Cards, Sheet, Verbs); content in one centred column, the sheet toolbar sticks while you scroll. */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --text: #0e1014;
  --muted: #5e6875;
  --line: #e1e4e9;
  --line-2: #cfd4db;
  --accent: #ffd60a;
  --accent-ink: #141414;
  --mark: #fff0a3;
  --mark-ink: #2a2300;
  --focus: #1f6feb;
  --ok: #0c8f61;
  --ok-soft: #e1f5ec;
  --bad: #db3b40;
  --bad-soft: #fde9ea;
  --akk: #2459d6;
  --akk-soft: #e5edff;
  --dat: #8a3ad6;
  --dat-soft: #f2e8fd;
  --shadow: 0 1px 2px rgba(15, 20, 30, .05), 0 12px 32px -16px rgba(15, 20, 30, .22);
  --f: "Onest", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c0f; --surface: #15171c; --surface-2: #1d2027; --text: #f2f4f7; --muted: #9aa3af; --line: #262a32; --line-2: #343a44;
    --accent: #ffd60a; --accent-ink: #141414; --mark: #3b3208; --mark-ink: #fff2b3; --focus: #5b9dff;
    --ok: #3ccf91; --ok-soft: #10291f; --bad: #ff6b6f; --bad-soft: #341618; --akk: #82a9ff; --akk-soft: #18243f; --dat: #c69bff; --dat-soft: #281a3e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -16px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c0f; --surface: #15171c; --surface-2: #1d2027; --text: #f2f4f7; --muted: #9aa3af; --line: #262a32; --line-2: #343a44;
  --accent: #ffd60a; --accent-ink: #141414; --mark: #3b3208; --mark-ink: #fff2b3; --focus: #5b9dff;
  --ok: #3ccf91; --ok-soft: #10291f; --bad: #ff6b6f; --bad-soft: #341618; --akk: #82a9ff; --akk-soft: #18243f; --dat: #c69bff; --dat-soft: #281a3e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -16px rgba(0, 0, 0, .9);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--f); font-size: 16px; line-height: 1.5; padding-block: 0 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
html[dir="rtl"] body { line-height: 1.65; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 940px; margin: 0 auto; }
.de { direction: ltr; unicode-bidi: isolate; text-align: start; }

/* app bar */
.bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 940px; margin: 0 auto; min-height: 60px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 750; font-size: 1.02rem; letter-spacing: -.01em; text-decoration: none; color: var(--text); }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: .82rem; letter-spacing: -.02em; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 11px; padding: 3px; margin-inline-start: 6px; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem; padding: 6px 12px; border-radius: 8px; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.bar-end { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--muted); max-width: 240px; min-width: 0; }
.sync span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.sync[data-s="remote"] i { background: var(--ok); }
.sync[data-s="saving"] i, .sync[data-s="loading"] i { background: var(--focus); }
.sync[data-s="offline"] i { background: var(--bad); }
.langsel { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; font-size: .9rem; font-weight: 600; }

/* shared bits */
main { padding-block: 26px 0; }
h1.title { font-size: clamp(1.75rem, 4.6vw, 2.5rem); font-weight: 780; letter-spacing: -.03em; line-height: 1.08; margin: 0 0 10px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 22px; max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.label { font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
html[dir="rtl"] .label { letter-spacing: 0; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 4px; padding: 0 .12em; }
.kbd { font-family: var(--f-mono); font-size: .72rem; font-weight: 600; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 16px; font-weight: 650; font-size: .95rem; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(.97); }
.btn.primary .kbd { background: rgba(255, 255, 255, .55); color: var(--accent-ink); border-color: rgba(0, 0, 0, .18); }
.btn.big { padding: 14px 22px; font-size: 1.05rem; border-radius: 13px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--text); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--surface-2); color: var(--muted); letter-spacing: .02em; }
.case { display: inline-flex; font-size: .74rem; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
.case.A { background: var(--akk-soft); color: var(--akk); }
.case.D { background: var(--dat-soft); color: var(--dat); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 13px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.seg.topic { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg.topic button { padding-inline: 6px; text-align: center; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.toggle { display: flex; align-items: center; gap: 10px; font-size: .95rem; cursor: pointer; }
.toggle input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line-2); position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.toggle input:checked { background: var(--text); }
.toggle input:checked::after { transform: translateX(16px); }
html[dir="rtl"] .toggle input:checked::after { transform: translateX(-16px); }
.toggle input:disabled { opacity: .4; cursor: not-allowed; }

/* home */
.home { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.setup { display: grid; gap: 22px; }
.levels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.lvl { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 10px 10px; text-align: start; display: grid; gap: 5px; }
.lvl b { font-size: 1.05rem; font-weight: 750; }
.lvl span { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl .meter { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.lvl .meter i { display: block; height: 100%; background: var(--ok); }
.lvl[aria-pressed="true"] { border-color: var(--text); background: var(--surface); }
.lvl[aria-pressed="false"] { background: var(--bg); }
.lvl[aria-pressed="false"] b { color: var(--muted); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.opt { display: grid; gap: 7px; align-content: start; min-width: 0; }
.opt .sub { font-size: .8rem; color: var(--muted); }
.toggles { display: grid; gap: 12px; }
.startbox { display: grid; gap: 8px; }
.startbox .meta { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.side { display: grid; gap: 16px; }
.srsbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.srsbar i { display: block; height: 100%; min-width: 0; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; margin-top: 14px; }
.legend div { display: grid; gap: 1px; }
.legend b { font-size: 1.25rem; font-weight: 750; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; }
.legend b::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }
.legend span { font-size: .78rem; color: var(--muted); }
.note { font-size: .84rem; color: var(--muted); margin: 14px 0 0; }
.howto { display: grid; gap: 10px; font-size: .9rem; }
.howto .ex { font-size: 1.15rem; font-weight: 600; }
.howto .ex u { text-decoration: none; border-bottom: 2px solid var(--text); padding: 0 .2em; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .84rem; }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; color: var(--bad); }

/* card session */
.session { max-width: 760px; margin: 0 auto; }
.sbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--text); border-radius: 3px; transition: width .25s ease; }
.sbar .count { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 30px); display: grid; gap: 16px; animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
.qmeta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qverb { font-weight: 650; font-size: 1.05rem; }
.qverb .q { color: var(--muted); font-weight: 500; }
.qverb b { font-weight: 750; }
.qtrans { margin: -6px 0 0; color: var(--muted); }
.qtrans .btn { padding: 0; font-size: .92rem; color: var(--focus); }
.qtext { font-size: clamp(1.45rem, 4.6vw, 2rem); font-weight: 560; line-height: 1.55; letter-spacing: -.012em; overflow-wrap: anywhere; }
.qtext.dlg { font-size: clamp(1.2rem, 3.8vw, 1.55rem); display: grid; gap: 4px; }
.qtext p { margin: 0; }
input.blank {
  display: inline-block; width: 4ch; min-width: 3ch; max-width: 100%; margin: 0 .05em; padding: 0 .3em; height: 1.35em;
  font: inherit; font-weight: 700; letter-spacing: 0; color: var(--text); text-align: center; vertical-align: baseline;
  background: var(--surface-2); border: 1.5px solid var(--line-2); border-radius: 10px;
}
input.blank:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); background: var(--surface); }
input.blank.ok { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
input.blank.bad { color: var(--bad); background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; }
input.blank.shown { color: var(--muted); border-style: dashed; }
.peek { display: inline-block; font-weight: 700; color: var(--muted); border: 1.5px dashed var(--line-2); border-radius: 8px; padding: 0 .3em; margin-inline-start: .15em; }
button.mk { border: 0; padding: 0; cursor: pointer; font: inherit; }
.srow.bad button.mk:hover::before, .srow.bad button.mk:focus-visible::before { content: "↺"; font-size: 1rem; }
.fix { display: inline-block; font-weight: 750; color: var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 0 .3em; margin-inline-start: .15em; }
.qcase { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qcase > span { color: var(--muted); font-size: .9rem; }
.casebtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; }
.casebtn[aria-pressed="true"][data-case="A"] { border-color: var(--akk); background: var(--akk-soft); color: var(--akk); }
.casebtn[aria-pressed="true"][data-case="D"] { border-color: var(--dat); background: var(--dat-soft); color: var(--dat); }
.qcase.flash .casebtn { animation: flash .5s ease 2; }
@keyframes flash { 50% { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); } }
.warn { margin: 0; min-height: 1.3em; color: var(--bad); font-size: .9rem; }
.qfoot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.qfoot .keys { flex: 1; }
.qfoot .acts { display: flex; gap: 8px; margin-inline-start: auto; }
.qres { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 12px; position: relative; }
.verdict { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.verdict strong { font-size: 1.15rem; font-weight: 750; display: inline-flex; align-items: center; gap: 8px; }
.verdict strong::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.qres.ok .verdict strong { color: var(--ok); }
.qres.bad .verdict strong { color: var(--bad); }
.verdict span { color: var(--muted); }
.ruleline { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ruleline b { font-weight: 800; }
.dialog { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.dialog .label { margin-bottom: 4px; }
.dialog p { margin: 0; }
.dialog .ans { font-weight: 750; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.qres .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.auto { position: absolute; inset-inline: 0; bottom: -18px; height: 3px; border-radius: 2px; overflow: hidden; background: transparent; }
.auto i { display: block; height: 100%; width: 100%; background: var(--ok); transform-origin: left; animation: drain var(--t, 1200ms) linear forwards; }
html[dir="rtl"] .auto i { transform-origin: right; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* round summary */
.summary { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
.score { font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.mlist { list-style: none; margin: 0; padding: 0; }
.mlist li { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mlist li:last-child { border-bottom: 0; }
.mlist .v { font-weight: 600; }
.mlist .v b { font-weight: 800; }
.mlist .t { color: var(--muted); font-size: .9rem; flex-basis: 100%; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* sheet */
.sheet-tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding-block: 12px; margin-bottom: 6px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.tools-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.minilv { display: flex; gap: 4px; flex-wrap: wrap; }
.minilv button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 4px 9px; font-weight: 700; font-size: .85rem; color: var(--muted); }
.minilv button[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
.stats { display: flex; gap: 14px; font-size: .9rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.stats b { color: var(--text); font-weight: 750; }
.stats .s-ok b { color: var(--ok); }
.stats .s-bad b { color: var(--bad); }
.tools-row .spacer { flex: 1; }
.rows { list-style: none; margin: 0; padding: 0; }
.srow { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) 1.6em; gap: 6px 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.srow .num { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; padding-top: .35em; text-align: end; }
.srow .stxt { font-size: 1.12rem; font-weight: 540; line-height: 1.7; overflow-wrap: anywhere; }
.srow .stxt p { margin: 0; }
.srow input.blank { height: 1.45em; border-radius: 8px; }
.srow .shint { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 3px; }
.srow .shint .de b { color: var(--text); font-weight: 750; }
.srow .mk { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; margin-top: .15em; }
.srow.ok .mk { background: var(--ok-soft); color: var(--ok); }
.srow.bad .mk { background: var(--bad-soft); color: var(--bad); }
.srow.ok .mk::before { content: "✓"; }
.srow.bad .mk::before { content: "×"; font-size: 1.1rem; }
.sempty { color: var(--muted); padding: 24px 0; }

/* verbs */
.vtools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.vtools input[type="search"] { flex: 1 1 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 14px; }
.vlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-inline-start: auto; }
.vlegend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.learning { background: #e0a100; }
.dot.done { background: var(--ok); }
.vlist h3 { font-size: 1rem; font-weight: 750; margin: 22px 0 4px; }
.vlist h4 { display: flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 14px 0 0; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
html[dir="rtl"] .vlist h4 { letter-spacing: 0; }
.fq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; vertical-align: -1px; flex: none; }
.fq i { display: block; width: 3px; border-radius: 1px; background: var(--line-2); }
.fq i:nth-child(1) { height: 5px; } .fq i:nth-child(2) { height: 8px; } .fq i:nth-child(3) { height: 11px; }
.fq.f3 i, .fq.f2 i:nth-child(-n+2), .fq.f1 i:nth-child(1) { background: var(--text); }

/* ---------- state ---------- */
let S = { lang: "de", levels: ["A1", "A2"], topic: "p", mode: "s", len: 15, askCase: true, showTrans: true, autoNext: true, hints: true, freq: [3, 2, 1], sort: "freq" };

const t = (k, v) => {
  let s = (I18N[S.lang] && I18N[S.lang][k]) || I18N.de[k] || I18N.ru[k] || k;

};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const keyOf = (c, mode) => mode + "|" + c.id;
// progress keys: s = sentence, d = small talk, pa = da-/wo-words, ei = -einander

// keep Latin bits (Akk., zum) readable inside Arabic text
const bidi = x => (/[A-Za-zÄÖÜäöüß]/.test(String(x)) ? "\u2066" + x + "\u2069" : String(x));

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- storage ---------- */
function loadLocal() {

  S.levels = (Array.isArray(S.levels) ? S.levels : []).filter(l => LEVELS.includes(l));
  if (![10, 15, 20, 30].includes(S.len)) S.len = 15;
  if (!["s", "d"].includes(S.mode)) S.mode = "s";
  if (!["p", "da", "ei"].includes(S.topic)) S.topic = "p";
  S.freq = (Array.isArray(S.freq) ? S.freq : []).filter(f => [1, 2, 3].includes(f));

}

const remote = { ref: null, writing: false, dirty: false, timer: null, disabled: false, retried: false };
function setSync(s) {
  syncState = s;
  syncEl.dataset.s = s;
  const txt = t({ local: "sLocal", remote: "sRemote", saving: "sSaving", loading: "sLoading", offline: "sOffline" }[s]);
  syncEl.querySelector("span").textContent = txt;
  syncEl.title = txt;
}
function mergeRemote(rc) {
  let changed = false, localNewer = false;
  for (const [k, e] of Object.entries(rc || {})) {
    if (!Array.isArray(e) || e.length < 5) continue;
    if (!P[k] || e[4] > P[k][4]) { P[k] = e; changed = true; }
  }
  for (const [k, e] of Object.entries(P)) if (!rc || !rc[k] || rc[k][4] < e[4]) localNewer = true;
  return { changed, localNewer };
}
async function initRemote() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
  if (!db || !user) { setSync("local"); return; }
  let id = null;
  try { id = await user.id(); } catch (e) {}
  if (!id) { setSync("local"); return; }
  try { remote.ref = db.doc("data/users/" + id + "/trainer"); } catch (e) { setSync("local"); return; }
  setSync("loading");
  let settled = false;
  const timer = setTimeout(() => { if (!settled) setSync("offline"); }, 10000);
  try {
    const snap = await remote.ref.get();
    settled = true; clearTimeout(timer);
    const body = snap.exists ? snap.data() : null;
    const { changed, localNewer } = mergeRemote(body && body.c);
    if (changed) { saveLocalProgress(); if ((view === "cards" && sub === "home") || view === "verbs") render(); }
    setSync("remote");
    if (!snap.exists ? Object.keys(P).length > 0 : localNewer) scheduleRemote(0);
  } catch (e) {
    settled = true; clearTimeout(timer);
    if (e && ["not_granted", "revoked", "capability_disabled", "capability_removed"].includes(e.code)) { remote.disabled = true; setSync("local"); }
    else setSync("offline");
  }
}
function scheduleRemote(delay) {
  if (!remote.ref || remote.disabled) return;
  clearTimeout(remote.timer);
  remote.timer = setTimeout(flushRemote, delay == null ? 1500 : delay);
}
async function flushRemote() {
  clearTimeout(remote.timer); remote.timer = null;
  if (!remote.ref || remote.disabled) return;
  if (remote.writing) { remote.dirty = true; return; }
  remote.writing = true; remote.dirty = false;
  setSync("saving");
  try {
    await remote.ref.set({ v: 1, c: P });
    remote.retried = false;
    setSync("remote");
  } catch (e) {
    const code = e && e.code;
    if (["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed", "transform_error"].includes(code)) {
      remote.disabled = true; setSync("local");
    } else if (code === "unavailable" && !remote.retried) {
      remote.retried = true; setSync("offline");
      setTimeout(() => scheduleRemote(0), 2000 + Math.random() * 2000);
    } else setSync("offline");
  }
  remote.writing = false;
  if (remote.dirty) flushRemote();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && remote.timer) flushRemote(); });
function persist() { saveLocalProgress(); scheduleRemote(); }

/* ---------- scheduling ---------- */
function setFor(m) { return m === "pa" ? DA : m === "ei" ? EI : m === "d" ? CARDS.filter(c => c.st) : CARDS; }
function pool(mode) {
  return setFor(mode || curMode()).filter(c => S.levels.includes(c.l) && inFreq(c));
}
function boxStats(list, mode) {
  const now = Date.now();
  const st = { fresh: 0, f: [0, 0, 0, 0, 0], due: 0, learned: 0 };
  for (const c of list) {
    const e = P[keyOf(c, mode)];
    if (!e) { st.fresh++; continue; }
    st.f[Math.max(0, e[0] - 1)]++;
    if (e[0] >= 3) st.learned++;
    if (e[1] <= now) st.due++;
  }
  return st;
}
function applyResult(c, mode, ok, relearn) {
  const k = keyOf(c, mode), now = Date.now();
  const e = P[k] ? P[k].slice() : [0, now, 0, 0, now];
  e[2]++;
  if (ok) { e[0] = relearn ? 1 : Math.min(5, e[0] + 1); e[1] = now + INTERVAL[e[0]]; }
  else { e[0] = 0; e[1] = now; e[3]++; }
  e[4] = now;
  P[k] = e;
  persist();
}
function buildRound(practise) {
  const now = Date.now(), m = curMode();
  const items = pool();
  const due = items.filter(c => { const e = P[keyOf(c, m)]; return e && e[1] <= now; })
    .sort((a, b) => P[keyOf(a, m)][1] - P[keyOf(b, m)][1] || P[keyOf(a, m)][0] - P[keyOf(b, m)][0]);
  let queue = due.slice(0, S.len);
  if (queue.length < S.len) {
    const fresh = [];
    for (const lv of LEVELS) fresh.push(...shuffle(items.filter(c => c.l === lv && !P[keyOf(c, m)])).sort((a, b) => (b.f || 0) - (a.f || 0) || (b.q || 0) - (a.q || 0)));
    queue = queue.concat(fresh.slice(0, S.len - queue.length));
  }
  if (!queue.length && practise) {
    queue = shuffle(items.slice()).sort((a, b) => (P[keyOf(a, m)] ? P[keyOf(a, m)][0] : 0) - (P[keyOf(b, m)] ? P[keyOf(b, m)][0] : 0)).slice(0, S.len);
  }
  if (!queue.length) return null;
  return { queue: shuffle(queue), total: queue.length, done: 0, firstOk: 0, seen: new Set(), wrong: new Set(), cur: null, phase: "ask", caseSel: null, mode: m };
}

/* ---------- answer checking ---------- */
function norm(s) {
  return String(s || "").normalize("NFC").trim().toLowerCase().replace(/\s+/g, " ")
    .replace(/ue/g, "ü").replace(/ae/g, "ä").replace(/oe/g, "ö");
}
const fold = s => norm(s).replace(/ü/g, "u").replace(/ä/g, "a").replace(/ö/g, "o");
function gradeBlank(answer, expected, prep, alt) {
  const a = norm(answer), x = norm(expected);
  if (!a) return { ok: false, empty: true };
  if (a === x || COLLO[x] === a || COLLO[a] === x) return { ok: true };
  if (x.endsWith("einander")) {
    if (a.replace(/[\s-]+/g, "") === x) return { ok: true, note: ["nEinSpace", { x: expected }] };
    if (fold(a) === fold(x)) return { ok: true, note: ["nUmlaut", { x: expected }] };
    if (a === fold(prep) || a === prep || a.startsWith(prep + " ") || a === "einander") return { ok: false, note: ["nEinNeeded", { x: expected }] };
    return { ok: false };
  }
  if (alt && alt.map(norm).includes(a)) return { ok: true, note: ["nAlt", { x: expected }] };
  if (/^(da|wo)r/.test(x) && fold(a) === fold(x.slice(0, 2) + x.slice(3))) return { ok: false, note: ["nDaR", { x: expected }] };
  if (/^(da|wo)/.test(x) && (a === prep || a.startsWith(prep + " "))) return { ok: false, note: ["nDaNeeded", { x: expected }] };
  if (CONTR[x] && CONTR[x] === a) return { ok: true, note: ["nContrUsual", { x: expected }] };
  if (fold(a) === fold(x)) return { ok: true, note: ["nUmlaut", { x: expected }] };
  if (CONTR[x] && CONTR[x].split(" ")[0] === a) return { ok: false, note: ["nContrNeeded", { x: expected, y: CONTR[x] }] };
  if ((FORMS[prep] || []).map(fold).includes(fold(a))) return { ok: false, note: ["nOtherForm", { x: expected }] };
  return { ok: false };
}
function expectedOf(c, mode) {
  const out = [];
  for (const segs of (mode === "d" ? c.st : [c.ex])) for (const s of segs) if (s[0] === "2") out.push(s.slice(1));
  return out;
}

/* ---------- card round ---------- */
function startRound(practise) {
  R = buildRound(practise);
  if (!R) { render(); return; }
  nextCard();
}
function nextCard() {
  clearAuto();
  if (!R.queue.length) { sub = "done"; render(); window.scrollTo(0, 0); return; }
  R.cur = R.queue.shift();
  R.phase = "ask"; R.caseSel = null; R.result = null; R.answers = null; R.transOpen = S.showTrans;
  sub = "card"; render();
}
function renderCard() {
  clearAuto();
  const c = R.cur, dlg = R.mode === "d", asking = R.phase === "ask";
  const askCase = S.askCase && R.mode === "s";
  const segsList = dlg ? c.st : [c.ex];
  const pct = Math.round(100 * R.done / R.total);
  const r = R.result;

  let html =
    '<div class="session">' +
    '<div class="sbar"><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="' + R.total + '" aria-valuenow="' + R.done + '"><i style="width:' + pct + '%"></i></div>' +
    '<span class="count">' + esc(t("cardOf", { i: Math.min(R.done + 1, R.total), n: R.total })) + '</span><button type="button" class="btn ghost" id="quit">' + esc(t("quit")) + "</button></div>" +
    '<section class="qcard" id="qcard">' +
    '<div class="qmeta"><span class="pill">' + c.l + (dlg ? " · " + esc(t("dialog")) : "") + '</span>' + freqBars(c.f) + '<span class="qverb de" dir="ltr" lang="de">' + verbLabel(c, R.mode, !asking) + "</span>" + (!asking && caseShown(R.mode) ? '<span class="case ' + c.c + '">' + esc(caseName(c.c)) + "</span>" : "") + "</div>" +
    '<p class="qtrans" dir="auto">' + (R.transOpen || !asking ? esc(trOf(c)) : '<button type="button" class="btn ghost" id="show-trans">' + esc(t("transShow")) + "</button>") + "</p>" +
    '<div class="qtext de' + (dlg ? " dlg" : "") + '" dir="ltr" lang="de">' +
    segHTML(segsList, { inputs: true, vals: R.answers || [], marks: asking ? null : r.each, fix: true }) + "</div>";

  if (asking) {
    html += (askCase ? '<div class="qcase" id="qcase"><span>' + esc(t("caseQ")) + "</span>" +
        '<button type="button" class="casebtn" data-case="A" aria-pressed="' + (R.caseSel === "A") + '">' + kbd("1") + esc(caseName("A")) + "</button>" +
        '<button type="button" class="casebtn" data-case="D" aria-pressed="' + (R.caseSel === "D") + '">' + kbd("2") + esc(caseName("D")) + "</button></div>" : "") +
      '<p class="warn" id="warn" aria-live="polite"></p>' +
      '<div class="qfoot"><div class="keys"><span>' + kbd("Enter") + esc(t("kEnter")) + "</span>" +
      (askCase ? "<span>" + kbd("1") + kbd("2") + esc(t("kCase")) + "</span>" : "") +
      (dlg ? "<span>" + kbd("Tab") + esc(t("kTab")) + "</span>" : "") +
      "<span>" + kbd("Esc") + esc(t("kEsc")) + "</span></div>" +
      '<div class="acts"><button type="button" class="btn" id="dunno">' + esc(t("dontKnow")) + '</button><button type="button" class="btn primary" id="check">' + esc(t("check")) + "</button></div></div>";
  } else {
    html += '<div class="qres ' + (r.ok ? "ok" : "bad") + '" aria-live="polite">' +
      '<div class="verdict"><strong>' + esc(r.revealed ? t("revealed") : (r.ok ? t("ok") : t("bad"))) + "</strong>" + r.notes.map(n => "<span>" + esc(noteText(n)) + "</span>").join(" ") + "</div>" +
      (!dlg && c.st ? '<div class="dialog de" dir="ltr" lang="de"><p class="label" dir="auto">' + esc(t("dialog")) + "</p>" + segHTML(c.st, {}) + "</div>" : "") +
      '<div class="acts">' + (!r.ok && !r.revealed ? '<button type="button" class="btn ghost" id="accept">' + esc(t("accept")) + "</button>" : "") +
      '<button type="button" class="btn primary" id="next">' + esc(t("next")) + " " + kbd("Enter") + "</button></div>" +
      (r.ok && S.autoNext ? '<div class="auto" id="auto" style="--t:' + AUTO_MS + 'ms"><i></i></div>' : "") +
      "</div>";
  }
  html += "</section></div>";
  app.innerHTML = html;

  document.getElementById("quit").addEventListener("click", () => { clearAuto(); sub = R.seen.size ? "done" : "home"; render(); });
  const fields = [...app.querySelectorAll("#qcard input.blank")];

  if (asking) {
    fields.forEach((el, i) => {
      sizeInput(el);
      el.addEventListener("input", () => { sizeInput(el); setWarn(""); });
      el.addEventListener("keydown", ev => onCardKey(ev, el, i, fields, askCase));
    });
    const st = document.getElementById("show-trans");
    if (st) st.addEventListener("click", () => { R.transOpen = true; const keep = fields.map(f => f.value); R.answers = keep; renderCard(); R.answers = null; focusFirstEmpty(); });
    app.querySelectorAll("[data-case]").forEach(b => b.addEventListener("click", () => { pickCase(b.dataset.case); if (allFilled()) submit(false); else focusFirstEmpty(); }));
    document.getElementById("check").addEventListener("click", () => submit(false));
    document.getElementById("dunno").addEventListener("click", () => submit(true));
    focusFirstEmpty();
  } else {
    document.getElementById("next").addEventListener("click", () => nextCard());
    const ac = document.getElementById("accept"); if (ac) ac.addEventListener("click", overrideCorrect);
    document.getElementById("next").focus({ preventScroll: true });
    if (r.ok && S.autoNext) {
      autoTimer = setTimeout(() => { autoTimer = null; if (view === "cards" && sub === "card" && R && R.phase === "show") nextCard(); }, AUTO_MS);
      const stop = () => { clearAuto(); const a = document.getElementById("auto"); if (a) a.remove(); };
      document.getElementById("qcard").addEventListener("pointerdown", ev => { if (!ev.target.closest("#next")) stop(); });
    }
  }
}
function setWarn(s) { const w = document.getElementById("warn"); if (w) w.textContent = s; }
function cardFields() { return [...app.querySelectorAll("#qcard input.blank")]; }
function allFilled() { return cardFields().every(f => norm(f.value)); }
function focusFirstEmpty() {
  const fs = cardFields();
  const el = fs.find(f => !norm(f.value)) || fs[0];
  if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
}
function onCardKey(ev, el, i, fields, askCase) {
  if (ev.key === "Enter") {
    ev.preventDefault(); ev.stopPropagation();
    if (ev.isComposing) return;
    // in a dialogue, Enter walks to the next empty gap before checking
    const nextEmpty = fields.slice(i + 1).find(f => !norm(f.value)) || fields.slice(0, i).find(f => !norm(f.value));
    if (norm(el.value) && nextEmpty) { nextEmpty.focus(); return; }
    submit(false);
  } else if (ev.key === "Escape") {
    ev.preventDefault(); ev.stopPropagation(); submit(true);
  } else if (askCase && (ev.key === "1" || ev.key === "2")) {
    ev.preventDefault(); ev.stopPropagation();
    pickCase(ev.key === "1" ? "A" : "D");

  }
}
function pickCase(cs) {
  R.caseSel = cs;
  app.querySelectorAll("[data-case]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.case === cs)));
  setWarn("");
}
function submit(reveal) {
  const c = R.cur, dlg = R.mode === "d", askCase = S.askCase && R.mode === "s";
  const fields = cardFields();
  const answers = fields.map(f => f.value);
  if (!reveal) {
    if (answers.some(a => !norm(a))) { setWarn(dlg ? t("needInputD") : t("needInput")); focusFirstEmpty(); return; }
    if (askCase && !R.caseSel) {
      setWarn(t("needCase"));
      const q = document.getElementById("qcase");
      if (q) { q.classList.remove("flash"); void q.offsetWidth; q.classList.add("flash"); }
      return;
    }
  }
  const expected = expectedOf(c, R.mode);
  const notes = [];
  const each = expected.map((x, i) => {
    if (reveal) return false;
    const g = gradeBlank(answers[i], x, c.p, c.alt);
    if (g.note && !notes.some(n => n[0] === g.note[0])) notes.push(g.note);
    return g.ok;
  });
  let ok = !reveal && each.every(Boolean);
  if (ok && askCase && R.caseSel !== c.c) { ok = false; notes.push(["nCase", { c: c.c }]); }
  R.answers = reveal ? expected.map(() => "") : answers;
  R.result = { ok, each: ok ? each.map(() => true) : each, notes, revealed: reveal };
  if (!ok && askCase && each.every(Boolean)) R.result.each = each; // prepositions right, case wrong: keep inputs green
  R.phase = "show";
  registerAnswer(c, ok);
  renderCard();
}
function registerAnswer(c, ok) {
  const k = keyOf(c, R.mode), first = !R.seen.has(c.id);
  R.undo = { entry: P[k] ? P[k].slice() : null, first, wasMissed: R.wrong.has(c.id) };
  R.seen.add(c.id);
  if (ok) { if (first) R.firstOk++; applyResult(c, R.mode, true, R.wrong.has(c.id)); R.done++; }
  else { applyResult(c, R.mode, false); R.wrong.add(c.id); R.queue.splice(Math.min(R.queue.length, 3), 0, c); }
}
function overrideCorrect() {
  const c = R.cur, k = keyOf(c, R.mode), u = R.undo;

  if (idx >= 0) R.queue.splice(idx, 1);
  if (u.entry) P[k] = u.entry; else delete P[k];
  if (!u.wasMissed) R.wrong.delete(c.id);
  if (u.first) R.firstOk++;
  applyResult(c, R.mode, true, R.wrong.has(c.id));
  R.done++;
  R.result = { ...R.result, ok: true, each: R.result.each.map(() => true), notes: [] };
  renderCard();
}
function renderDone() {
  clearAuto();
  const missed = ALL.filter(c => R.wrong.has(c.id));
  const answered = R.seen.size;
  app.innerHTML =
    '<section class="summary"><div class="panel" style="display:grid;gap:18px">' +
    '<div><p class="label">' + esc(t("done")) + '</p><div class="score">' + R.firstOk + " / " + answered + '</div><div style="color:var(--muted)">' + esc(t("firstTry", { n: answered })) + "</div></div>" +
    (missed.length
      ? '<div><p class="label">' + esc(t("mistakes")) + '</p><ul class="mlist">' + missed.map(c =>
          '<li><span class="v de" dir="ltr" lang="de">' + verbLabel(c, R.mode, true) + '</span>' + (caseShown(R.mode) ? '<span class="case ' + c.c + '">' + esc(caseName(c.c)) + '</span>' : "") + '<span class="t" dir="auto">' + esc(trOf(c)) + "</span></li>").join("") + "</ul></div>"
      : "<p>" + esc(t("noMistakes")) + "</p>") +
    '<div class="acts"><button type="button" class="btn primary big" id="again">' + esc(t("again")) + " " + kbd("Enter") + '</button><button type="button" class="btn big" id="home">' + esc(t("home")) + "</button></div>" +
    "</div></section>";
  document.getElementById("again").addEventListener("click", () => startRound(true));
  document.getElementById("home").addEventListener("click", () => { sub = "home"; R = null; render(); });
  document.getElementById("again").focus({ preventScroll: true });
}

/* ---------- sheet ---------- */
function sheetSig() { return curMode() + "|" + S.levels.join(",") + "|" + S.freq.join("") + "|" + S.sort; }
function ensureSheet(reshuffle) {
  const sig = sheetSig();
  if (sig !== SH.sig) SH.peek = false;
  if (reshuffle || !SH.orders[sig]) {
    const list = pool();
    if (S.sort === "freq") list.sort(byFreq);
    const ids = list.map(c => c.id);
    SH.orders[sig] = reshuffle ? shuffle(ids) : ids;
  }
  SH.order = SH.orders[sig];
  SH.sig = sig;
}
function sheetKey(id) { return curMode() + "|" + id; }
function rowHTML(id, i) {
  const c = BYID.get(id), k = sheetKey(id);
  const res = SH.res[k], vals = SH.ans[k] || [];
  const segsList = curMode() === "d" ? c.st : [c.ex];
  const marks = res ? res.each : null;
  const cls = res ? (res.ok ? " ok" : " bad") : "";
  const showVerb = !!res;
  const hint = S.hints || res
    ? '<div class="shint"><span class="pill">' + c.l + '</span>' + freqBars(c.f) + '<span class="de" dir="ltr" lang="de">' + verbLabel(c, curMode(), showVerb) + "</span>" +
      (showVerb && caseShown(curMode()) ? '<span class="case ' + c.c + '">' + esc(caseName(c.c)) + "</span>" : "") + '<span dir="auto">' + esc(trOf(c)) + "</span></div>"
    : "";
  return '<li class="srow' + cls + '" id="row-' + i + '" data-id="' + esc(id) + '"><span class="num">' + (i + 1) + "</span>" +
    '<div><div class="stxt de" dir="ltr" lang="de">' + segHTML(segsList, { inputs: true, row: id, vals, marks, fix: true, peek: SH.peek }) + "</div>" + hint + "</div>" +
    (res && !res.ok ? '<button type="button" class="mk" data-retry title="' + esc(t("retry")) + '" aria-label="' + esc(t("retry")) + '"></button>' : '<span class="mk" aria-hidden="true"></span>') + "</li>";
}
function sheetCounts() {
  let ok = 0, bad = 0;
  for (const id of SH.order) { const r = SH.res[sheetKey(id)]; if (r) { if (r.ok) ok++; else bad++; } }
  return { ok, bad, left: SH.order.length - ok - bad };
}
function updateStats() {
  const s = sheetCounts();
  const el = document.getElementById("stats");
  if (el) el.innerHTML = '<span class="s-ok"><b>' + s.ok + "</b> " + esc(t("sOk")) + '</span><span class="s-bad"><b>' + s.bad + "</b> " + esc(t("sBad")) + "</span><span><b>" + s.left + "</b> " + esc(t("sLeft")) + "</span>";
}
function renderSheet() {
  ensureSheet(false);
  const rows = SH.order.map((id, i) => rowHTML(id, i)).join("");
  app.innerHTML =
    '<h1 class="title">' + esc(t("sheetTitle")) + '</h1><p class="lead">' + esc(t("sheetNote")) + "</p>" +
    '<div class="sheet-tools">' +
    '<div class="tools-row"><div class="minilv">' + levelButtons("mini") + "</div>" +
    topicSeg() + (S.topic === "p" ? modeSeg() : "") +
    '<label class="toggle"><input type="checkbox" id="opt-hints"' + (S.hints ? " checked" : "") + "><span>" + esc(t("hints")) + "</span></label></div>" +
    '<div class="tools-row">' + (S.topic !== "ei" ? freqChips() : "") + sortSeg() + "</div>" +
    '<div class="tools-row"><div class="stats" id="stats"></div><span class="spacer"></span>' +
    '<button type="button" class="btn primary" id="check-all">' + esc(t("checkAll")) + '</button><button type="button" class="btn" id="show-all" aria-pressed="' + SH.peek + '">' + esc(SH.peek ? t("hideAnswers") : t("showAnswers")) +
    '</button><button type="button" class="btn ghost" id="shuffle">' + esc(t("shuffle")) + '</button><button type="button" class="btn ghost" id="clear">' + esc(t("clear")) + "</button></div>" +
    "</div>" +
    (SH.order.length ? '<ol class="rows" id="rows">' + rows + "</ol>" : '<p class="sempty">' + esc(S.levels.length ? t("noCards") : t("sheetEmpty")) + "</p>");
  updateStats();
  bindLevelButtons(renderSheet);
  app.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.mode; saveSettings(); renderSheet(); }));
  app.querySelectorAll("[data-topic]").forEach(b => b.addEventListener("click", () => { S.topic = b.dataset.topic; saveSettings(); renderSheet(); }));
  bindFreqSort(renderSheet);
  const oh = document.getElementById("opt-hints"); oh.addEventListener("change", () => { S.hints = oh.checked; saveSettings(); renderSheet(); });
  document.getElementById("check-all").addEventListener("click", () => {
    for (const id of SH.order) { const k = sheetKey(id); if (!SH.res[k] && (SH.ans[k] || []).length && expectedOf(BYID.get(id), curMode()).every((_, n) => norm((SH.ans[k] || [])[n]))) gradeRow(id, false); }
    renderSheet();
  });
  // "Show answers" only peeks: nothing is graded or stored, and the same button hides them again
  document.getElementById("show-all").addEventListener("click", () => {
    const y = window.scrollY;
    SH.peek = !SH.peek; renderSheet(); window.scrollTo(0, y);
    const b = document.getElementById("show-all"); if (b) b.focus({ preventScroll: true });
  });
  document.getElementById("shuffle").addEventListener("click", () => { SH.peek = false; ensureSheet(true); renderSheet(); window.scrollTo(0, 0); focusNextRow(-1); });
  document.getElementById("clear").addEventListener("click", () => {
    for (const id of SH.order) { delete SH.ans[sheetKey(id)]; delete SH.res[sheetKey(id)]; }
    SH.peek = false; renderSheet(); window.scrollTo(0, 0); focusNextRow(-1);
  });
  const list = document.getElementById("rows");
  if (!list) return;
  list.addEventListener("click", ev => {
    const btn = ev.target.closest("[data-retry]"); if (!btn) return;
    const li = btn.closest(".srow"), k = sheetKey(li.dataset.id);
    delete SH.res[k]; delete SH.ans[k];
    const i = +li.id.slice(4); refreshRow(li); focusNextRow(i - 1);
  });
  list.addEventListener("input", ev => {
    const el = ev.target; if (!el.matches("input.blank")) return;
    sizeInput(el);
    const id = el.dataset.row, k = sheetKey(id);
    const arr = SH.ans[k] || (SH.ans[k] = []);
    arr[+el.dataset.n] = el.value;
  });
  list.addEventListener("keydown", ev => {
    const el = ev.target; if (!el.matches("input.blank") || ev.isComposing) return;
    const li = el.closest(".srow"), id = li.dataset.id;
    const fs = [...li.querySelectorAll("input.blank")];

      ev.preventDefault();
      const i = fs.indexOf(el);
      const nextEmpty = fs.slice(i + 1).find(f => !norm(f.value));
      if (norm(el.value) && nextEmpty) { nextEmpty.focus(); return; }
      if (fs.some(f => !norm(f.value))) { (fs.find(f => !norm(f.value)) || el).focus(); return; }

    }
  });

function gradeRow(id, reveal) {

  const expected = expectedOf(c, curMode());
  const each = expected.map((x, n) => !reveal && gradeBlank(vals[n], x, c.p, c.alt).ok);
  const ok = !reveal && each.every(Boolean);
  SH.res[k] = { ok, each, revealed: reveal };
  if (!SH.reviewed.has(k)) { SH.reviewed.add(k); applyResult(c, curMode(), ok, false); }
}
function refreshRow(li) {
  const i = +li.id.slice(4), id = li.dataset.id;
  const tmp = document.createElement("ol");
  tmp.innerHTML = rowHTML(id, i);
  li.replaceWith(tmp.firstElementChild);
  updateStats();
}
function focusNextRow(from) {
  const n = SH.order.length;
  for (let step = 1; step <= n; step++) {
    const i = (from + step + n) % n;
    const li = document.getElementById("row-" + i);
    if (!li || li.classList.contains("ok") || li.classList.contains("bad")) continue;
    const f = [...li.querySelectorAll("input.blank")].find(x => !norm(x.value)) || li.querySelector("input.blank");
    if (f) {
      f.focus({ preventScroll: true });
      const r = li.getBoundingClientRect();
      if (r.top < 140 || r.bottom > window.innerHeight - 80) li.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" });
      return;
    }
  }
}

/* ---------- verbs ---------- */
function renderVerbs() {
  const q = norm(listQuery);
  const status = c => { const e = P[keyOf(c, "s")]; return !e ? "" : (e[0] >= 3 ? "done" : "learning"); };
  const match = c => !q || norm(c.b + " " + c.p).includes(q) || fold(c.b + " " + c.p).includes(fold(q)) || LANGS.some(l => norm(c[l]).includes(q));
  const row = c => '<div class="vrow"><span class="dot ' + status(c) + '"></span><span class="v de" dir="ltr" lang="de">' + esc(c.b) + " <b>" + esc(c.p) + "</b>" + freqBars(c.f) +
    '</span><span><span class="case ' + c.c + '">' + esc(caseName(c.c)) + '</span></span><span class="t" dir="auto">' + esc(trOf(c)) + "</span></div>";
  let body = "";
  for (const lv of LEVELS) {
    const rows = CARDS.filter(c => c.l === lv && match(c) && inFreq(c));
    if (!rows.length) continue;
    body += "<h3>" + lv + " · " + rows.length + "</h3>";
    if (S.sort === "freq" && rows[0].f) {
      for (const f of [3, 2, 1]) {
        const band = rows.filter(c => c.f === f).sort(byFreq);
        if (band.length) body += "<h4>" + freqBars(f) + "<span>" + esc(t(FK[f])) + " · " + band.length + "</span></h4>" + band.map(row).join("");
      }
    } else body += rows.map(row).join("");
  }
  app.innerHTML =
    '<h1 class="title">' + esc(t("navVerbs")) + "</h1>" +
    '<div class="vtools"><input type="search" id="q" placeholder="' + esc(t("search")) + '" value="' + esc(listQuery) + '" dir="auto">' + sortSeg() + freqChips() +
    '<div class="vlegend"><span><i class="dot"></i>' + esc(t("lNew")) + '</span><span><i class="dot learning"></i>' + esc(t("lLearning")) + '</span><span><i class="dot done"></i>' + esc(t("lDone")) + "</span></div></div>" +
    '<div class="vlist">' + (body || '<p class="sempty">' + esc(t("nothingFound")) + "</p>") + "</div>";
  bindFreqSort(renderVerbs);
  const qi = document.getElementById("q");
  qi.addEventListener("input", () => {
    listQuery = qi.value;
    const pos = qi.selectionStart;
    renderVerbs();
    const n = document.getElementById("q"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
  });
}

/* ---------- global keys & boot ---------- */
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" || ev.defaultPrevented || ev.isComposing) return;
  const tag = (ev.target && ev.target.tagName) || "";
  if (tag === "BUTTON" || tag === "A" || tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (view !== "cards") return;
  if (sub === "card" && R && R.phase === "show") { ev.preventDefault(); nextCard(); }
  else if (sub === "home") { const b = document.getElementById("start") || document.getElementById("practise"); if (b) { ev.preventDefault(); b.click(); } }
  else if (sub === "done") { ev.preventDefault(); startRound(true); }
});
document.getElementById("lang").addEventListener("change", ev => {
  S.lang = ev.target.value; saveSettings();
  const keep = R && sub === "card" && R.phase === "ask" ? cardFields().map(f => f.value) : null;
  if (keep) R.answers = keep;
  render();
  if (keep) { R.answers = null; focusFirstEmpty(); }
});

loadLocal();
if (!S.levels.length) S.levels = ["A1", "A2"];
view = ["cards", "sheet", "verbs"].includes((location.hash || "").slice(1)) ? location.hash.slice(1) : "cards";
render();
initRemote();
})();
</script>
